name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # @lingui/cli uses fs.globSync (Node >= 22)
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile i18n catalogs
        # messages.mjs is generated (gitignored); the app imports it statically.
        run: npm run i18n:compile
      - name: Build
        env:
          VITE_DEMO_MODE: 'true'
        run: npx vite build --base /soberana-demo/ --mode demo
      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
